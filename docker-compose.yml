

services:

  neo4j:
    image: neo4j:5.20.0
    container_name: neo4j-cti
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    environment:
      NEO4J_AUTH: "${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:?Set NEO4J_PASSWORD in the ignored .env file}"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    restart: unless-stopped

  redis:
    image: redis:7.2-alpine
    container_name: redis-cti
    ports:
      - "127.0.0.1:6379:6379"
    restart: unless-stopped

volumes:
  neo4j_data:
  neo4j_logs:
